limit_req_zone $binary_remote_addr zone=opendart_submit:10m rate=2r/m;
limit_req_zone $binary_remote_addr zone=opendart_read:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=opendart_draco:10m rate=6r/m;
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 1k;
    client_body_timeout 10s;
    send_timeout 20s;
    limit_req_status 429;
    location = /api/jobs {
        limit_except POST { deny all; }
        limit_req zone=opendart_submit burst=2 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 15s;
    }
    location / {
        limit_req zone=opendart_read burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 15s;
    }
    location = /api/draco/analyze {
        limit_except POST { deny all; }
        limit_req zone=opendart_draco burst=2 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 20s;
    }
}
